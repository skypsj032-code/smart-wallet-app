name: smart_wallet_app
description: Smart Wallet local-first MVP application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  flutter_riverpod: ^2.5.1
  google_mlkit_text_recognition: ^0.13.0
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  drift: 2.20.3
  sqlite3: 2.4.6
  sqlite3_flutter_libs: 0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  google_fonts: ^8.0.2
  file_picker: ^11.0.2
  crypto: ^3.0.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: 2.20.3
  build_runner: 2.4.12
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "as