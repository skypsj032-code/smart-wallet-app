name: Wallet visual review (temporary)
on:
  pull_request:
    branches:
      - feat/design-system
permissions:
  contents: read
jobs:
  flutter-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download pull request source
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\smart wallet' | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'wallet-source.zip'
          Invoke-WebRequest -Uri "https://github.com/skypsj032-code/smart-wallet-app/archive/$env:PR_HEAD_SHA.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath 'C:\smart wallet'
          Rename-Item -Path "C:\smart wallet\smart-wallet-app-$env:PR_HEAD_SHA" -NewName 'app'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: false
          pub-cache-path: 'C:\smart wallet\.pub-cache'
      - name: Prepare project wrappers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\dev' | Out-Null
          New-Item -ItemType Junction -Path 'C:\dev\flutter' -Target $env:FLUTTER_ROOT | Out-Null
          $wrapper = @'
          @echo off
          setlocal
          cd /d "C:\smart wallet\app"
          set "PUB_CACHE=C:\smart wallet\.pub-cache"
          call "C:\dev\flutter\bin\flutter.bat" %*
          exit /b %ERRORLEVEL%
          '@
          Set-Content -LiteralPath 'C:\smart wallet\flutterw.bat' -Value $wrapper -Encoding ascii
      - name: Check manual preview manifest
        shell: pwsh
        run: |
          python 'C:\smart wallet\app\test\security\manual_manifest_test.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked packages
        shell: pwsh
        run: |
          & 'C:\smart wallet\flutterw.bat' pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate database sources
        shell: pwsh
        run: |
          & 'C:\smart wallet\flutterw.bat' pub run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store generated database source
        uses: actions/upload-artifact@v4
        with:
          name: wallet-drift-generated
          path: 'C:\smart wallet\app\lib\core\database\app_database.g.dart'
          retention-days: 1
      - name: Provide SQLite for database tests
        shell: pwsh
        run: Copy-Item -Path "$env:WINDIR\System32\winsqlite3.dll" -Destination 'C:\smart wallet\app\sqlite3.dll'
      - name: Download Korean test font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\smart wallet\visual' | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' -OutFile 'C:\smart wallet\visual\NotoSansKR.ttf'
      - name: Capture phone screens
        shell: pwsh
        run: |
          & 'C:\smart wallet\flutterw.bat' test --no-pub --update-goldens --timeout 90s test/visual_review/ui_capture_test.dart -r expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-ui-review
          path: 'C:\smart wallet\app\test\visual_review\goldens\*.png'
          if-no-files-found: warn
          retention-days: 7

      - name: Run usability regression checks
        if: always()
        shell: pwsh
        run: |
          & 'C:\smart wallet\flutterw.bat' test --no-pub --timeout 45s --concurrency=1 -r expanded test/features/dashboard/dashboard_screen_navigation_test.dart test/features/transactions/quick_entry_exit_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
